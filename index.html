<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz cumpleaños 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    background: radial-gradient(ellipse at bottom, #3b1d5e 0%, #1a0f33 45%, #07040f 100%);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #cielo, #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cielo { z-index: 0; }
  #fx { z-index: 5; pointer-events: none; }

  /* ---------- Corazones flotantes ---------- */
  #corazones { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .corazon {
    position: absolute; bottom: -40px; opacity: .55;
    animation: flotar linear forwards;
    filter: drop-shadow(0 0 6px rgba(255, 120, 170, .6));
  }
  @keyframes flotar { to { transform: translateY(-115vh) rotate(30deg); opacity: 0; } }

  /* ---------- Escenas ---------- */
  .escena {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; overflow-y: auto;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  .escena.activa { opacity: 1; pointer-events: auto; }
  .contenido { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }

  .subtitulo { font-size: 1.15rem; font-weight: 300; letter-spacing: 1px; margin-bottom: 40px; opacity: .9; }
  .pista { font-size: 1rem; opacity: .85; margin-top: 30px; animation: respirar 2s ease-in-out infinite; }
  .nota { font-size: .8rem; opacity: .6; margin-top: 12px; }
  @keyframes respirar { 50% { opacity: .4; } }

  .titulo-script, .titulo-grande {
    font-family: 'Dancing Script', cursive;
    background: linear-gradient(90deg, #ffd56b, #ff8fb1, #c3a6ff, #ffd56b);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: brillo 6s linear infinite;
  }
  .titulo-script { font-size: clamp(2.2rem, 9vw, 3.4rem); }
  .titulo-grande { font-size: clamp(2.4rem, 9vw, 4.2rem); line-height: 1.15; margin-bottom: 28px; }
  @keyframes brillo { to { background-position: 300% 0; } }

  .boton {
    margin-top: 26px; padding: 14px 26px; border: none; border-radius: 999px;
    font-family: inherit; font-size: 1rem; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff5c8a, #b44dff);
    box-shadow: 0 8px 30px rgba(255, 92, 138, .45);
    transition: transform .2s;
  }
  .boton:active { transform: scale(.95); }
  .boton:disabled { opacity: .85; cursor: default; }

  /* ---------- Regalo ---------- */
  .regalo { position: relative; width: 160px; height: 150px; cursor: pointer; animation: latido 1.6s ease-in-out infinite; }
  .regalo.abierto { animation: none; }
  .caja {
    position: absolute; bottom: 0; left: 10px; width: 140px; height: 110px;
    background: linear-gradient(160deg, #ff6f98, #d93565); border-radius: 6px;
    box-shadow: 0 15px 40px rgba(255, 80, 140, .45);
    transition: transform 1s ease, opacity 1s ease;
  }
  .caja::before {
    content: ''; position: absolute; left: 60px; top: 0; width: 20px; height: 100%;
    background: linear-gradient(#ffe08a, #f4b93c);
  }
  .tapa {
    position: absolute; top: 18px; left: 0; width: 160px; height: 36px; z-index: 2;
    background: linear-gradient(160deg, #ff8fb1, #ec4a7a); border-radius: 6px;
    transition: transform 1s cubic-bezier(.5, -0.4, .5, 1), opacity 1s ease;
  }
  .tapa::before {
    content: ''; position: absolute; left: 70px; top: 0; width: 20px; height: 100%;
    background: linear-gradient(#ffe08a, #f4b93c);
  }
  .mono { position: absolute; left: 80px; top: 0; }
  .mono::before, .mono::after {
    content: ''; position: absolute; top: -26px; width: 34px; height: 26px;
    border: 7px solid #ffd56b; border-radius: 50% 50% 0 50%;
  }
  .mono::before { right: 0; transform: rotate(20deg); }
  .mono::after { left: 0; transform: rotate(-20deg) scaleX(-1); }
  .regalo.abierto .tapa { transform: translate(40px, -180px) rotate(35deg); opacity: 0; }
  .regalo.abierto .caja { transform: scale(.6) translateY(40px); opacity: 0; }
  .luz {
    position: absolute; left: 50%; top: 40%; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; transform: translate(-50%, -50%) scale(0); opacity: 0;
    box-shadow: 0 0 60px 30px #ffe6a8;
  }
  .regalo.abierto .luz { animation: destello 1.2s ease forwards; }
  @keyframes destello { 40% { opacity: 1; transform: translate(-50%, -50%) scale(6); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(14); } }
  @keyframes latido { 0%, 100% { transform: scale(1) rotate(0); } 10% { transform: scale(1.06) rotate(-3deg); } 20% { transform: scale(1) rotate(3deg); } 30% { transform: scale(1.04) rotate(0); } }

  /* ---------- Pastel ---------- */
  .pastel { position: relative; width: 260px; height: 270px; margin-top: 20px; }
  .plato {
    position: absolute; bottom: 0; left: -20px; width: 300px; height: 22px; border-radius: 50%;
    background: linear-gradient(#ffffff, #cfc6e0); box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }
  .piso { position: absolute; border-radius: 12px 12px 8px 8px; overflow: hidden; }
  .piso-abajo { bottom: 12px; left: 0; width: 260px; height: 95px; background: linear-gradient(90deg, #e9709b, #ff9dbf 45%, #e9709b); }
  .piso-arriba { bottom: 107px; left: 35px; width: 190px; height: 72px; background: linear-gradient(90deg, #b886f0, #d9b8ff 45%, #b886f0); }
  .glaseado { height: 18px; background: #fff3f8; position: relative; }
  .glaseado::after {
    content: ''; position: absolute; left: 0; top: 17px; width: 100%; height: 16px;
    background: radial-gradient(circle at 13px 0, #fff3f8 9px, transparent 10px) repeat-x;
    background-size: 26px 16px;
  }
  .puntos {
    position: absolute; left: 0; right: 0; bottom: 14px; height: 10px;
    background: radial-gradient(circle, #ffd56b 3px, transparent 4px) repeat-x; background-size: 22px 10px;
  }

  .velas { position: absolute; bottom: 179px; left: 45px; width: 170px; display: flex; justify-content: space-evenly; align-items: flex-end; }
  .vela {
    position: relative; width: 12px; height: 52px; border-radius: 3px; cursor: pointer;
    background: repeating-linear-gradient(45deg, #fff 0 6px, #7ec8e3 6px 12px);
    animation: aparecer .6s backwards;
  }
  .vela::before {
    content: ''; position: absolute; left: 50%; bottom: 40px; width: 80px; height: 80px; margin-left: -40px;
    background: radial-gradient(circle, rgba(255, 200, 100, .35), transparent 65%);
    transition: opacity .4s; pointer-events: none;
  }
  .mecha { position: absolute; left: 5px; top: -6px; width: 2px; height: 7px; background: #3a2a1a; }
  .llama {
    position: absolute; left: 50%; bottom: 55px; width: 15px; height: 26px; margin-left: -7.5px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 75%, #fff 0 18%, #ffe27a 38%, #ff9a1f 68%, rgba(255, 80, 0, 0) 72%);
    transform-origin: 50% 100%;
    animation: parpadeo .12s ease-in-out infinite alternate;
    transition: opacity .35s, transform .35s;
  }
  .pastel.soplando .llama { animation: inclinar .12s ease-in-out infinite alternate; }
  .vela.apagada .llama { animation: none; opacity: 0; transform: scale(0); }
  .vela.apagada::before { opacity: 0; }
  @keyframes parpadeo { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.1) rotate(3deg); } }
  @keyframes inclinar { from { transform: skewX(-25deg) scale(.85, .9); } to { transform: skewX(-40deg) scale(.6, .7); } }
  @keyframes aparecer { from { transform: translateY(20px); opacity: 0; } }

  .humo {
    position: absolute; left: 2px; bottom: 56px; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(220, 220, 235, .65); animation: humo 1.8s ease-out forwards; pointer-events: none;
  }
  @keyframes humo { to { transform: translate(-14px, -80px) scale(4.5); opacity: 0; } }

  .medidor {
    width: 200px; height: 8px; margin-top: 14px; border-radius: 99px; overflow: hidden;
    background: rgba(255, 255, 255, .15); opacity: 0; transition: opacity .4s;
  }
  .medidor.visible { opacity: 1; }
  .barra { width: 0; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7ee8fa, #ff8fb1); transition: width .08s; }

  /* ---------- Carta ---------- */
  .carta {
    position: relative; max-width: 520px; width: 100%; padding: 30px 26px; border-radius: 20px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    text-align: left; font-size: 1.02rem; line-height: 1.75; font-weight: 300;
    min-height: 120px;
  }
  #texto { white-space: pre-line; }
  #texto::after { content: '|'; margin-left: 2px; animation: cursor .8s steps(1) infinite; color: #ff8fb1; }
  #texto.listo::after { display: none; }
  @keyframes cursor { 50% { opacity: 0; } }
  .firma {
    margin-top: 20px; text-align: right; font-family: 'Dancing Script', cursive; font-size: 1.6rem; color: #ffb3cb;
    opacity: 0; transition: opacity 1.5s;
  }
  .firma.visible { opacity: 1; }
  #btn-repetir { opacity: 0; transition: opacity 1s; }
  #btn-repetir.visible { opacity: 1; }
</style>
</head>
<body>

<canvas id="cielo"></canvas>
<div id="corazones"></div>

<!-- Escena 1: el regalo -->
<section id="escena-regalo" class="escena activa">
  <div class="contenido">
    <p class="subtitulo">Hay algo especial esperándote...</p>
    <div class="regalo" id="regalo">
      <div class="luz"></div>
      <div class="tapa"><div class="mono"></div></div>
      <div class="caja"></div>
    </div>
    <p class="pista">Toca el regalo 🎁</p>
  </div>
</section>

<!-- Escena 2: el pastel -->
<section id="escena-pastel" class="escena">
  <div class="contenido">
    <h2 class="titulo-script">Pide un deseo...</h2>
    <p class="pista" id="instruccion">y sopla las velas 🌬️</p>
    <div class="pastel" id="pastel">
      <div class="velas" id="velas"></div>
      <div class="piso piso-arriba"><div class="glaseado"></div><div class="puntos"></div></div>
      <div class="piso piso-abajo"><div class="glaseado"></div><div class="puntos"></div></div>
      <div class="plato"></div>
    </div>
    <button id="btn-mic" class="boton">🎤 Soplar con el micrófono</button>
    <div class="medidor" id="medidor"><div class="barra" id="barra"></div></div>
    <p class="nota">También puedes tocar cada vela para apagarla</p>
  </div>
</section>

<!-- Escena 3: la carta -->
<section id="escena-carta" class="escena">
  <div class="contenido">
    <h1 class="titulo-grande">¡Feliz cumpleaños<br><span id="nombre"></span>!</h1>
    <div class="carta">
      <p id="texto"></p>
      <p class="firma" id="firma"></p>
    </div>
    <button id="btn-repetir" class="boton">✨ Más fuegos artificiales</button>
  </div>
</section>

<canvas id="fx"></canvas>

<script>
/* =========================================================
   ✏️  PERSONALIZA AQUÍ  ✏️
   ========================================================= */
const CONFIG = {
  nombre: "amor mío",                       // su nombre o como le dices
  firma: "Con todo mi amor 💖",            // cómo firmas la carta
  velas: 5,                                // cuántas velas tiene el pastel (máx. ~7)
  cancion: "",                             // opcional: "nuestra-cancion.mp3" (en la misma carpeta)
  mensaje:
`Feliz cumpleaños amor mío. Hoy el mundo celebra el día en que llegaste a él, y yo celebro lo afortunado que soy de tenerte en mi vida.

Que Dios te bendiga y te siga dando muchos años más de vida, y que todos tus sueños se cumplan en este nuevo año, porque te mereces lo más bonito del universo.

Te amo con toda mi alma ❤️`
};
/* ========================================================= */

const $ = (id) => document.getElementById(id);
const azar = (a, b) => a + Math.random() * (b - a);
let audioCtx = null;

/* ---------- Cielo de estrellas ---------- */
const cielo = $('cielo'), c = cielo.getContext('2d');
const fx = $('fx'), g = fx.getContext('2d');
let W, H, estrellas = [], fugaz = null;

function ajustar() {
  W = cielo.width = fx.width = innerWidth;
  H = cielo.height = fx.height = innerHeight;
  estrellas = Array.from({ length: Math.floor(W * H / 3500) }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: azar(.3, 1.6), f: azar(0, 6.28), v: azar(.01, .04)
  }));
}
addEventListener('resize', ajustar);
ajustar();

function animarCielo() {
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#fff';
  for (const e of estrellas) {
    e.f += e.v;
    c.globalAlpha = .25 + .75 * Math.abs(Math.sin(e.f));
    c.beginPath(); c.arc(e.x, e.y, e.r, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
  if (!fugaz && Math.random() < .005) fugaz = { x: azar(W * .3, W), y: azar(0, H * .35), vida: 1 };
  if (fugaz) {
    const largo = 120;
    const grad = c.createLinearGradient(fugaz.x, fugaz.y, fugaz.x + largo, fugaz.y - largo / 2);
    grad.addColorStop(0, `rgba(255,255,255,${fugaz.vida})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    c.strokeStyle = grad; c.lineWidth = 2;
    c.beginPath(); c.moveTo(fugaz.x, fugaz.y); c.lineTo(fugaz.x + largo, fugaz.y - largo / 2); c.stroke();
    fugaz.x -= 10; fugaz.y += 5; fugaz.vida -= .02;
    if (fugaz.vida <= 0) fugaz = null;
  }
  requestAnimationFrame(animarCielo);
}
animarCielo();

/* ---------- Corazones flotantes ---------- */
function corazon() {
  const s = document.createElement('span');
  s.className = 'corazon';
  s.textContent = ['❤', '💖', '💕', '✨', '💗'][Math.floor(Math.random() * 5)];
  s.style.left = azar(0, 100) + 'vw';
  s.style.fontSize = azar(12, 28) + 'px';
  const dur = azar(7, 13);
  s.style.animationDuration = dur + 's';
  $('corazones').appendChild(s);
  setTimeout(() => s.remove(), dur * 1000);
}
setInterval(corazon, 800);

/* ---------- Cambiar de escena ---------- */
function mostrar(id) {
  document.querySelectorAll('.escena').forEach(e => e.classList.remove('activa'));
  $(id).classList.add('activa');
}

/* ---------- Escena 1: abrir regalo ---------- */
$('regalo').addEventListener('click', () => {
  const r = $('regalo');
  if (r.classList.contains('abierto')) return;
  r.classList.add('abierto');
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  tocarCampanita();
  const rect = r.getBoundingClientRect();
  setTimeout(() => explosion(rect.left + rect.width / 2, rect.top + rect.height / 2, 90), 350);
  setTimeout(() => { mostrar('escena-pastel'); crearVelas(); }, 1500);
});

/* ---------- Escena 2: pastel y velas ---------- */
const pastel = $('pastel');
function crearVelas() {
  const cont = $('velas');
  cont.innerHTML = '';
  for (let i = 0; i < CONFIG.velas; i++) {
    const v = document.createElement('div');
    v.className = 'vela';
    v.style.animationDelay = (.3 + i * .15) + 's';
    v.innerHTML = '<div class="mecha"></div><div class="llama"></div>';
    v.addEventListener('click', () => apagar(v));
    cont.appendChild(v);
  }
}
const quedan = () => document.querySelectorAll('.vela:not(.apagada)').length;

function apagar(v) {
  if (v.classList.contains('apagada')) return;
  v.classList.add('apagada');
  const h = document.createElement('div');
  h.className = 'humo';
  v.appendChild(h);
  setTimeout(() => h.remove(), 1900);
  if (quedan() === 0) {
    pastel.classList.remove('soplando');
    $('instruccion').textContent = '¡Tu deseo se cumplirá! 💫';
    $('btn-mic').style.display = 'none';
    setTimeout(celebrar, 1300);
  }
}
function apagarUna() {
  const v = document.querySelector('.vela:not(.apagada)');
  if (v) apagar(v);
}

$('btn-mic').addEventListener('click', async () => {
  const btn = $('btn-mic');
  const instr = $('instruccion');
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    instr.textContent = 'Aquí no se puede usar el micrófono 😅 Toca las velas para apagarlas 💨';
    btn.style.display = 'none';
    return;
  }
  try {
    // Se apagan los filtros del navegador que borran el sonido del soplido
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    const fuente = audioCtx.createMediaStreamSource(stream);
    const analizador = audioCtx.createAnalyser();
    analizador.fftSize = 1024;
    fuente.connect(analizador);
    const datos = new Uint8Array(analizador.fftSize);
    const medidor = $('medidor'), barra = $('barra');

    const medir = () => {
      analizador.getByteTimeDomainData(datos);
      let suma = 0;
      for (const d of datos) { const x = (d - 128) / 128; suma += x * x; }
      return Math.sqrt(suma / datos.length);
    };

    // 1) Escucha el ruido del lugar un momento para calibrarse
    btn.disabled = true;
    btn.textContent = '🤫 Un segundito...';
    let base = 0, muestras = 0;
    const inicioCal = performance.now();
    await new Promise(listo => {
      (function calibrar() {
        base += medir(); muestras++;
        if (performance.now() - inicioCal < 900) requestAnimationFrame(calibrar); else listo();
      })();
    });
    base /= muestras;
    const umbral = Math.max(base * 2.5, 0.03);

    // 2) Escucha el soplido
    btn.textContent = '🌬️ ¡Sopla ahora!';
    instr.textContent = 'Sopla cerca del micrófono 🌬️';
    medidor.classList.add('visible');
    let fuerza = 0;
    (function escuchar() {
      const volumen = medir();
      barra.style.width = Math.min(100, (volumen / (umbral * 2)) * 100) + '%';
      if (volumen > umbral) {
        pastel.classList.add('soplando');
        if (++fuerza > 6) { apagarUna(); fuerza = 0; }
      } else {
        pastel.classList.remove('soplando');
        fuerza = Math.max(0, fuerza - 1);
      }
      if (quedan() > 0) requestAnimationFrame(escuchar);
      else { stream.getTracks().forEach(t => t.stop()); medidor.classList.remove('visible'); }
    })();
  } catch (e) {
    instr.textContent = 'No se dio permiso al micrófono. Toca las velas para apagarlas 💨';
    btn.style.display = 'none';
  }
});

/* ---------- Escena 3: celebración ---------- */
function celebrar() {
  mostrar('escena-carta');
  $('nombre').textContent = CONFIG.nombre;
  fiesta();
  musica();
  setTimeout(() => escribir(CONFIG.mensaje, $('texto'), () => {
    $('firma').textContent = CONFIG.firma;
    $('firma').classList.add('visible');
    $('btn-repetir').classList.add('visible');
  }), 1800);
}
$('btn-repetir').addEventListener('click', fiesta);

function escribir(texto, el, alTerminar) {
  let i = 0;
  (function paso() {
    el.textContent = texto.slice(0, ++i);
    if (i < texto.length) {
      const letra = texto[i - 1];
      setTimeout(paso, '.,!?\n'.includes(letra) ? 380 : 42);
    } else {
      el.classList.add('listo');
      alTerminar && alTerminar();
    }
  })();
}

/* ---------- Fuegos artificiales y confeti ---------- */
const colores = ['#ff5c8a', '#ffd56b', '#c3a6ff', '#7ee8fa', '#ff9a1f', '#ffffff', '#ff8fb1'];
let particulas = [], animando = false;

function explosion(x, y, n = 80) {
  const color = colores[Math.floor(Math.random() * colores.length)];
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, vel = azar(1.5, 6.5);
    particulas.push({ tipo: 'chispa', x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, vida: 1, color, r: azar(1.5, 3) });
  }
  arrancar();
}
function confeti(n) {
  for (let i = 0; i < n; i++) {
    particulas.push({
      tipo: 'confeti', x: Math.random() * W, y: azar(-H * .5, -10),
      vx: azar(-1, 1), vy: azar(2, 4.5), vida: 1, color: colores[Math.floor(Math.random() * colores.length)],
      w: azar(6, 11), h: azar(4, 7), rot: azar(0, 6.28), vr: azar(-.15, .15)
    });
  }
  arrancar();
}
function fiesta() {
  confeti(160);
  let n = 0;
  const id = setInterval(() => {
    explosion(azar(W * .1, W * .9), azar(H * .08, H * .5));
    if (++n > 14) clearInterval(id);
  }, 420);
}
function arrancar() {
  if (animando) return;
  animando = true;
  requestAnimationFrame(animarFx);
}
function animarFx() {
  g.clearRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  for (const p of particulas) {
    if (p.tipo === 'chispa') {
      p.vx *= .97; p.vy = p.vy * .97 + .06;
      p.x += p.vx; p.y += p.vy; p.vida -= .013;
      g.globalAlpha = Math.max(p.vida, 0);
      g.fillStyle = p.color;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
    }
  }
  g.globalCompositeOperation = 'source-over';
  for (const p of particulas) {
    if (p.tipo === 'confeti') {
      p.x += p.vx + Math.sin(p.rot) * .6; p.y += p.vy; p.rot += p.vr;
      if (p.y > H * .75) p.vida -= .02;
      g.globalAlpha = Math.max(p.vida, 0);
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      g.fillStyle = p.color; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 1);
      g.restore();
    }
  }
  g.globalAlpha = 1;
  particulas = particulas.filter(p => p.vida > 0 && p.y < H + 40);
  if (particulas.length) requestAnimationFrame(animarFx);
  else { animando = false; g.clearRect(0, 0, W, H); }
}

/* ---------- Sonidos ---------- */
function nota(freq, inicio, dur, vol = .18, tipo = 'sine') {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + inicio;
  const osc = audioCtx.createOscillator(), gan = audioCtx.createGain();
  osc.type = tipo; osc.frequency.value = freq;
  gan.gain.setValueAtTime(0, t);
  gan.gain.linearRampToValueAtTime(vol, t + .02);
  gan.gain.exponentialRampToValueAtTime(.001, t + dur * 1.6);
  osc.connect(gan).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur * 1.7);
}
function tocarCampanita() {
  [1046.5, 1318.5, 1568, 2093].forEach((f, i) => nota(f, i * .09, .5, .1));
}
function musica() {
  if (CONFIG.cancion) {
    const a = new Audio(CONFIG.cancion);
    a.volume = .8;
    a.play().catch(() => {});
    return;
  }
  if (!audioCtx) return;
  audioCtx.resume();
  // "Cumpleaños feliz" estilo cajita musical
  const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const melodia = [
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]
  ];
  const pulso = .42;
  let t = .3;
  for (const [n, d] of melodia) {
    nota(N[n], t, d * pulso, .16, 'sine');
    nota(N[n] * 2, t, d * pulso * .6, .04, 'triangle');
    t += d * pulso;
  }
}
