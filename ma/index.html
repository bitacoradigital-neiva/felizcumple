<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concierto morado para Ma 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden; background: #07030f; color: #fff; font-family: 'Poppins', sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .escena {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  .escena.activa { opacity: 1; pointer-events: auto; }

  /* ---------- Boleto ---------- */
  #escena-boleto {
    padding: 20px 16px; text-align: center;
    background: radial-gradient(ellipse at 50% 30%, #2a0f4d 0%, #0d0520 60%, #07030f 100%);
  }
  .previa { font-size: .8rem; letter-spacing: 4px; text-transform: uppercase; opacity: .7; margin-bottom: 22px; }
  .boleto {
    display: flex; width: min(94vw, 560px); cursor: pointer;
    filter: drop-shadow(0 20px 40px rgba(155, 93, 229, .45));
    animation: flotar 3s ease-in-out infinite;
  }
  @keyframes flotar { 50% { transform: translateY(-8px) rotate(-.6deg); } }
  .principal {
    position: relative; flex: 1; overflow: hidden; text-align: left;
    padding: 20px 18px; border-radius: 16px 0 0 16px;
    background: linear-gradient(135deg, #2a0f4d, #6b2fb3 60%, #a35ee8);
    transition: transform 1s ease, opacity 1s ease;
  }
  .principal::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 60%);
    background-size: 250% 100%; animation: holograma 3.5s linear infinite;
  }
  @keyframes holograma { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .etiqueta { display: inline-block; font-size: .65rem; font-weight: 800; letter-spacing: 3px; padding: 4px 10px; border-radius: 999px; background: #ffd56b; color: #2a0f4d; }
  .principal h2 { font-weight: 800; font-size: clamp(1.15rem, 5vw, 1.6rem); line-height: 1.15; margin: 10px 0 4px; }
  .principal .para { font-family: 'Dancing Script', cursive; font-size: clamp(1.5rem, 6.5vw, 2.1rem); color: #ffe3ff; }
  .datos { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 14px; margin-top: 12px; }
  .datos span { font-size: .55rem; letter-spacing: 2px; text-transform: uppercase; opacity: .7; display: block; }
  .datos b { font-size: .78rem; font-weight: 600; }

  .talon {
    position: relative; width: 104px; flex-shrink: 0; color: #2a0f4d;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 8px; border-radius: 0 16px 16px 0;
    background: linear-gradient(#efe2ff, #c9a6ff);
    border-left: 3px dashed rgba(42, 15, 77, .45);
    transform-origin: 0 50%;
    transition: transform 1.1s cubic-bezier(.5, -0.3, .6, 1), opacity 1.1s ease;
  }
  .talon::before, .talon::after {
    content: ''; position: absolute; left: -13px; width: 22px; height: 22px; border-radius: 50%; background: #0f0624;
  }
  .talon::before { top: -11px; } .talon::after { bottom: -11px; }
  .talon .admite { font-size: .6rem; font-weight: 800; letter-spacing: 2px; }
  .talon .vip { font-size: 1.6rem; font-weight: 800; line-height: 1; }
  .barras {
    width: 64px; height: 48px;
    background: repeating-linear-gradient(90deg, #2a0f4d 0 2px, transparent 2px 4px, #2a0f4d 4px 5px, transparent 5px 8px, #2a0f4d 8px 11px, transparent 11px 13px);
  }
  .boleto.rasgado { animation: none; }
  .boleto.rasgado .talon { transform: translate(40px, 90px) rotate(28deg); opacity: 0; }
  .boleto.rasgado .principal { transform: scale(1.08); opacity: 0; transition-delay: .5s; }
  .pista { margin-top: 26px; font-size: .9rem; opacity: .8; animation: respirar 2s ease-in-out infinite; }
  @keyframes respirar { 50% { opacity: .3; } }

  /* ---------- Estadio ---------- */
  #escena-estadio { justify-content: flex-start; background: #07030f; }
  #publico { position: absolute; inset: 0; width: 100%; height: 100%; }
  .haz {
    position: absolute; top: -8vh; width: 46vw; height: 115vh; left: 50%; margin-left: -23vw;
    transform-origin: 50% 0; pointer-events: none; mix-blend-mode: screen; opacity: 0;
    background: linear-gradient(rgba(205, 150, 255, .4), rgba(205, 150, 255, 0) 80%);
    clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%);
    transition: opacity 2s ease;
  }
  .encendido .haz { opacity: 1; }
  .haz.h1 { animation: barrer 7s ease-in-out infinite alternate; }
  .haz.h2 { animation: barrer 9s ease-in-out infinite alternate-reverse; background: linear-gradient(rgba(255, 170, 230, .32), rgba(255, 170, 230, 0) 80%); }
  .haz.h3 { animation: barrer 11s ease-in-out infinite alternate; animation-delay: -4s; }
  @keyframes barrer { from { transform: rotate(-32deg); } to { transform: rotate(32deg); } }

  .tarima { position: relative; z-index: 2; margin-top: 6vh; width: min(88vw, 540px); }
  .pantalla {
    position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    border: 2px solid rgba(220, 180, 255, .55);
    background: radial-gradient(ellipse at center, #3a1470 0%, #14072a 75%);
    box-shadow: 0 0 50px rgba(160, 90, 240, .55), inset 0 0 40px rgba(0, 0, 0, .6);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px;
  }
  .pantalla::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0 3px, rgba(0, 0, 0, .18) 3px 4px);
  }
  #texto-pantalla {
    font-weight: 800; font-size: clamp(1.3rem, 6vw, 2.4rem); line-height: 1.2;
    text-shadow: 0 0 18px rgba(220, 160, 255, .9), 0 0 40px rgba(160, 90, 240, .7);
    transition: opacity .5s ease, transform .5s ease;
  }
  #texto-pantalla.fuera { opacity: 0; transform: scale(.85); }
  .base-tarima {
    width: 112%; margin-left: -6%; height: 22px; margin-top: 10px;
    background: linear-gradient(#5a2a90, #1d0b38); clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
  }

  .pista-estadio {
    position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; z-index: 3;
    font-size: .8rem; opacity: 0; transition: opacity 1.5s ease; pointer-events: none;
  }
  .pista-estadio.ver { opacity: .7; }

  .boton {
    padding: 13px 26px; border: none; border-radius: 999px; cursor: pointer;
    font-family: 'Poppins', sans-serif; font-size: .95rem; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #9b5de5, #ff5ca8); box-shadow: 0 0 30px rgba(155, 93, 229, .6);
  }
  .boton:active { transform: scale(.95); }
  #btn-carta {
    position: absolute; z-index: 4; bottom: 110px; left: 50%; transform: translate(-50%, 20px);
    opacity: 0; pointer-events: none; transition: opacity 1s ease, transform 1s ease;
    animation: brillar 2s ease-in-out infinite;
  }
  #btn-carta.ver { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  @keyframes brillar { 50% { box-shadow: 0 0 55px rgba(255, 92, 168, .9); } }

  /* ---------- Carta ---------- */
  #escena-carta { z-index: 20; padding: 20px 16px; background: rgba(10, 4, 22, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; justify-content: flex-start; }
  .carta {
    margin: auto; width: min(92vw, 480px); padding: 30px 24px; border-radius: 18px; text-align: left;
    background: linear-gradient(160deg, rgba(155, 93, 229, .25), rgba(255, 92, 168, .12));
    border: 1px solid rgba(220, 180, 255, .35); box-shadow: 0 25px 70px rgba(0, 0, 0, .5);
  }
  .carta h3 { font-family: 'Dancing Script', cursive; font-size: clamp(2rem, 8vw, 2.6rem); color: #e9d5ff; margin-bottom: 14px; }
  #texto-carta { white-space: pre-line; font-weight: 300; font-size: 1.02rem; line-height: 1.75; min-height: 120px; }
  #texto-carta::after { content: '|'; color: #c77dff; animation: cursor .8s steps(1) infinite; }
  #texto-carta.listo::after { display: none; }
  @keyframes cursor { 50% { opacity: 0; } }
  .firma { margin-top: 20px; text-align: right; font-family: 'Dancing Script', cursive; font-size: 1.7rem; color: #ffb3e0; opacity: 0; transition: opacity 1.5s; }
  .firma.ver { opacity: 1; }
  .volver { display: block; margin: 22px auto 0; opacity: 0; transition: opacity 1s; }
  .volver.ver { opacity: 1; }

  /* ---------- Música ---------- */
  #yt-caja { position: fixed; left: -9999px; top: 0; width: 200px; height: 113px; opacity: 0; pointer-events: none; }
  .musica {
    position: fixed; z-index: 30; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-family: 'Poppins', sans-serif; font-size: .78rem; color: #fff; cursor: pointer; white-space: nowrap;
  }
  .musica.ver { display: flex; }
  .ecualizador { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
  .ecualizador i { width: 3px; background: #c77dff; border-radius: 2px; animation: barra .9s ease-in-out infinite alternate; }
  .ecualizador i:nth-child(2) { animation-delay: .2s; } .ecualizador i:nth-child(3) { animation-delay: .4s; } .ecualizador i:nth-child(4) { animation-delay: .1s; }
  .musica.pausada .ecualizador i { animation-play-state: paused; }
  @keyframes barra { from { height: 3px; } to { height: 14px; } }
</style>
</head>
<body>

<!-- 1. Boleto -->
<section class="escena activa" id="escena-boleto">
  <p class="previa">Tienes una invitación especial</p>
  <div class="boleto" id="boleto">
    <div class="principal">
      <span class="etiqueta">PASE VIP · ARMY</span>
      <h2>Concierto de<br>cumpleaños</h2>
      <div class="para" id="invitada"></div>
      <div class="datos">
        <div><span>Puerta</span><b>Corazón</b></div>
        <div><span>Fila</span><b>1</b></div>
        <div><span>Asiento</span><b>El mejor</b></div>
      </div>
    </div>
    <div class="talon">
      <span class="admite">ADMITE 1</span>
      <span class="vip">VIP</span>
      <div class="barras"></div>
    </div>
  </div>
  <p class="pista">Toca el boleto para entrar 💜</p>
</section>

<!-- 2. Estadio -->
<section class="escena" id="escena-estadio">
  <canvas id="publico"></canvas>
  <div class="haz h1"></div><div class="haz h2"></div><div class="haz h3"></div>
  <div class="tarima">
    <div class="pantalla"><div id="texto-pantalla"></div></div>
    <div class="base-tarima"></div>
  </div>
  <button class="boton" id="btn-carta">💌 Leer la carta de tu hijo</button>
  <p class="pista-estadio" id="pista-estadio">Toca el mar morado para hacer la ola 💜</p>
</section>

<!-- 3. Carta -->
<section class="escena" id="escena-carta">
  <div class="carta">
    <h3 id="saludo-carta"></h3>
    <p id="texto-carta"></p>
    <p class="firma" id="firma"></p>
    <button class="boton volver" id="btn-volver">Volver al concierto 💜</button>
  </div>
</section>

<div id="yt-caja"><div id="yt"></div></div>
<button class="musica" id="musica" aria-label="Pausar o reanudar la música">
  <span class="ecualizador"><i></i><i></i><i></i><i></i></span>
  <span id="musica-texto"></span>
</button>

<script>
/* =========================================================
   ✏️  PERSONALIZA AQUÍ  ✏️
   ========================================================= */
const CONFIG = {
  nombre: "Ma",
  cancion: {
    youtubeId: "c6ASQOwKkhk",            // Jin - The Astronaut
    nombre: "The Astronaut · Jin",
    empiezaEn: 0,
    volumen: 75
  },
  // Lo que va apareciendo en la pantalla gigante del escenario
  pantalla: [
    "¡Bienvenida, Ma! 💜",
    "Esta noche el escenario es todo tuyo",
    "Miles de luces brillan solo por ti",
    "¡Feliz cumpleaños! 🎂",
    "Toda la vida has sido mi mayor fan",
    "Hoy yo soy el tuyo",
    "Te morado, Ma 💜"
  ],
  saludo: "Para ti, Ma",
  carta:
`Feliz cumpleaños.

Hoy quiero darte las gracias, aunque sé que ninguna palabra me alcanza. Gracias por cuidarme cuando me enfermaba, por preocuparte siempre por si ya comí, por tus regaños que al final eran amor, y por todas esas oraciones que sé que haces por mí aunque no me lo digas.

No siempre te lo digo, pero te admiro muchísimo. Todo lo bueno que hay en mí lo aprendí de ti.

Que Dios te bendiga, te llene de salud y te regale muchísimos años más para seguir celebrándote. Y que hoy te sientas tan especial como lo eres para mí.

Te quiero con todo mi corazón.`,
  firma: "Te morado, Ma 💜 — Tu hijo"
};
/* ========================================================= */

const $ = (id) => document.getElementById(id);
const azar = (a, b) => a + Math.random() * (b - a);
const esperar = (ms) => new Promise(r => setTimeout(r, ms));

$('invitada').textContent = 'Invitada especial: ' + CONFIG.nombre;
$('saludo-carta').textContent = CONFIG.saludo;
$('musica-texto').textContent = '🎵 ' + CONFIG.cancion.nombre;

function mostrar(id) {
  document.querySelectorAll('.escena').forEach(e => { if (e.id !== 'escena-estadio' || id !== 'escena-carta') e.classList.remove('activa'); });
  $(id).classList.add('activa');
}

/* ---------- Música (YouTube) ---------- */
let reproductor = null, ytListo = false, quiereSonar = false, sonando = false;
window.onYouTubeIframeAPIReady = () => {
  reproductor = new YT.Player('yt', {
    width: 200, height: 113, videoId: CONFIG.cancion.youtubeId,
    playerVars: { autoplay: 0, controls: 0, playsinline: 1, rel: 0, loop: 1, playlist: CONFIG.cancion.youtubeId, start: CONFIG.cancion.empiezaEn },
    events: {
      onReady: () => { ytListo = true; reproductor.setVolume(CONFIG.cancion.volumen); if (quiereSonar) reproductor.playVideo(); },
      onStateChange: (e) => { sonando = e.data === YT.PlayerState.PLAYING; $('musica').classList.toggle('pausada', !sonando); }
    }
  });
};
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
$('musica').addEventListener('click', () => { if (!ytListo) return; if (sonando) reproductor.pauseVideo(); else reproductor.playVideo(); });

/* ---------- Mar morado (público) ---------- */
const lienzo = $('publico');
const ctx = lienzo.getContext('2d');
let W, H, luces = [], ondas = [], confeti = [];
let encenderDesde = Infinity, fiestaDesde = -Infinity;

const TONOS = ['#9b5de5', '#b57bff', '#c77dff', '#e0aaff', '#7b2cbf', '#ffffff'];
const brillos = TONOS.map(col => {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  r.addColorStop(0, '#ffffff'); r.addColorStop(.2, col); r.addColorStop(.5, col + '55'); r.addColorStop(1, col + '00');
  g.fillStyle = r; g.fillRect(0, 0, 32, 32);
  return c;
});

function crearPublico() {
  luces = [];
  const horizonte = H * .5;
  const filas = Math.max(30, Math.round(H / 15));
  for (let f = 0; f < filas; f++) {
    const p = f / (filas - 1);
    const y = horizonte + Math.pow(p, 1.7) * (H * 1.03 - horizonte);
    const sep = 6 + p * 28;
    const r = .7 + p * 3.4;
    for (let x = -Math.random() * sep; x < W + sep; x += sep) {
      luces.push({
        x: x + azar(-sep * .3, sep * .3), y: y + azar(-2, 2), r, p,
        fase: azar(0, 6.28), sp: Math.random() < .08 ? 5 : Math.floor(Math.random() * 5),
        retraso: (1 - p) * 1600 + Math.random() * 700
      });
    }
  }
}

function ajustar() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  lienzo.width = W * dpr; lienzo.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  crearPublico();
}
addEventListener('resize', ajustar);
ajustar();

lienzo.addEventListener('pointerdown', (e) => {
  ondas.push({ x: e.clientX, y: e.clientY, t0: performance.now() });
  if (ondas.length > 6) ondas.shift();
});

function lanzarConfeti(n) {
  for (let i = 0; i < n; i++) {
    confeti.push({
      x: azar(0, W), y: azar(-H * .6, -10), vx: azar(-1, 1), vy: azar(2, 4.5),
      w: azar(6, 11), h: azar(4, 7), rot: azar(0, 6.28), vr: azar(-.15, .15),
      color: ['#c77dff', '#e0aaff', '#ffd56b', '#ff8fd0', '#ffffff', '#9b5de5'][Math.floor(Math.random() * 6)], vida: 1
    });
  }
}

function cuadro(t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#07030f';
  ctx.fillRect(0, 0, W, H);
  const cielo = ctx.createLinearGradient(0, 0, 0, H * .55);
  cielo.addColorStop(0, '#120628'); cielo.addColorStop(1, '#07030f');
  ctx.fillStyle = cielo; ctx.fillRect(0, 0, W, H * .55);

  ctx.globalCompositeOperation = 'lighter';
  const fiesta = Math.max(0, 1 - (t - fiestaDesde) / 6000);
  for (const l of luces) {
    const enc = Math.min(1, Math.max(0, (t - encenderDesde - l.retraso) / 500));
    if (enc <= 0) continue;
    let b = .5 + .3 * Math.sin(t * .0028 - l.x * .012 + l.p * 2) + .12 * Math.sin(t * .006 + l.fase);
    if (fiesta > 0) b += fiesta * .5 * (Math.sin(t * .02 + l.fase) > .3 ? 1 : 0);
    for (const o of ondas) {
      const edad = t - o.t0;
      if (edad > 2600) continue;
      const d = Math.hypot(l.x - o.x, l.y - o.y);
      const frente = edad * .55;
      const dif = Math.abs(d - frente);
      if (dif < 70) b += (1 - dif / 70) * (1 - edad / 2600) * 1.1;
    }
    ctx.globalAlpha = Math.min(1, Math.max(.05, b)) * enc;
    const s = l.r * 5;
    ctx.drawImage(brillos[l.sp], l.x - s / 2, l.y - s / 2, s, s);
  }

  ctx.globalCompositeOperation = 'source-over';
  for (const c of confeti) {
    c.x += c.vx + Math.sin(c.rot) * .6; c.y += c.vy; c.rot += c.vr;
    if (c.y > H * .8) c.vida -= .02;
    ctx.globalAlpha = Math.max(0, c.vida);
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * Math.abs(Math.cos(c.rot * 2)) + 1);
    ctx.restore();
  }
  confeti = confeti.filter(c => c.vida > 0 && c.y < H + 30);

  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);

/* ---------- Pantalla del escenario ---------- */
async function ponerPantalla(texto) {
  const el = $('texto-pantalla');
  el.classList.add('fuera');
  await esperar(500);
  el.textContent = texto;
  el.classList.remove('fuera');
}

/* ---------- Secuencia ---------- */
let empezado = false;
$('boleto').addEventListener('click', async () => {
  if (empezado) return;
  empezado = true;
  quiereSonar = true;
  if (ytListo) reproductor.playVideo();
  $('boleto').classList.add('rasgado');
  await esperar(1400);
  mostrar('escena-estadio');
  $('musica').classList.add('ver');
  await esperar(900);
  encenderDesde = performance.now();
  $('escena-estadio').classList.add('encendido');
  await esperar(2600);
  $('pista-estadio').classList.add('ver');
  for (const texto of CONFIG.pantalla) {
    await ponerPantalla(texto);
    if (/cumpleaños/i.test(texto)) { fiestaDesde = performance.now(); lanzarConfeti(170); }
    await esperar(3600);
  }
  $('btn-carta').classList.add('ver');
});

/* ---------- Carta ---------- */
let cartaEscrita = false;
$('btn-carta').addEventListener('click', () => {
  $('escena-carta').classList.add('activa');
  if (cartaEscrita) return;
  cartaEscrita = true;
  escribir(CONFIG.carta, $('texto-carta'), () => {
    $('firma').textContent = CONFIG.firma;
    $('firma').classList.add('ver');
    $('btn-volver').classList.add('ver');
  });
});
$('btn-volver').addEventListener('click', () => {
  $('escena-carta').classList.remove('activa');
  fiestaDesde = performance.now();
  lanzarConfeti(120);
});

function escribir(texto, el, alTerminar) {
  let i = 0;
  (function paso() {
    el.textContent = texto.slice(0, ++i);
    if (i < texto.length) setTimeout(paso, '.,\n'.includes(texto[i - 1]) ? 320 : 32);
    else { el.classList.add('listo'); alTerminar && alTerminar(); }
  })();
}
</script>
</body>
</html>
