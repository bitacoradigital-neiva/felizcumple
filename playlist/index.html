<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist de cumpleaños para Ma 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --fondo: #0c0618; --tarjeta: rgba(255, 255, 255, .06); --borde: rgba(220, 180, 255, .18);
    --morado: #9b5de5; --lila: #c77dff; --rosa: #ff6fb5; --texto: #f4ecff; --suave: rgba(244, 236, 255, .65);
  }
  body {
    min-height: 100vh; color: var(--texto); font-family: 'Poppins', sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(155, 93, 229, .45), transparent 60%),
      radial-gradient(ellipse at 100% 100%, rgba(255, 111, 181, .18), transparent 50%),
      var(--fondo);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 22px 16px 60px; }

  /* ---------- Encabezado ---------- */
  .cabecera { display: flex; gap: 16px; align-items: flex-end; }
  .portada {
    position: relative; width: 132px; height: 132px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
    background: linear-gradient(140deg, #3b1470 0%, #7b2cbf 45%, #ff6fb5 100%);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .portada::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 25% 25%, rgba(255,255,255,.35) 0 2px, transparent 3px) 0 0 / 22px 22px;
    opacity: .5;
  }
  .portada .grande { position: relative; font-family: 'Dancing Script', cursive; font-weight: 700; font-size: 3.4rem; line-height: 1; text-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .portada .chico { position: relative; font-size: .6rem; font-weight: 800; letter-spacing: 3px; margin-top: 4px; opacity: .9; }
  .info .tipo { font-size: .65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--suave); }
  .info h1 { font-weight: 800; font-size: clamp(1.4rem, 6vw, 1.9rem); line-height: 1.1; margin: 4px 0 6px; }
  .info p { font-size: .8rem; color: var(--suave); }
  .info p b { color: var(--texto); font-weight: 600; }

  /* ---------- Reproductor ---------- */
  .reproductor {
    margin-top: 22px; padding: 14px; border-radius: 18px;
    background: var(--tarjeta); border: 1px solid var(--borde);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
  .video iframe, .video #yt { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ahora { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ahora .chip { display: inline-block; font-size: .65rem; font-weight: 800; letter-spacing: 2px; padding: 3px 10px; border-radius: 999px; background: rgba(199, 125, 255, .2); color: var(--lila); }
  .ahora h2 { font-size: 1.1rem; font-weight: 600; margin-top: 6px; }
  .corazon { font-size: 1.6rem; background: none; border: none; cursor: pointer; transition: transform .2s; }
  .corazon:active { transform: scale(1.3); }

  .dedicatoria {
    margin-top: 12px; padding: 14px 16px; border-radius: 12px; min-height: 92px;
    background: linear-gradient(135deg, rgba(155, 93, 229, .18), rgba(255, 111, 181, .1));
    border-left: 3px solid var(--rosa);
  }
  .dedicatoria small { display: block; font-size: .62rem; letter-spacing: 2px; text-transform: uppercase; color: var(--suave); margin-bottom: 6px; }
  #texto-dedicatoria { font-family: 'Dancing Script', cursive; font-size: clamp(1.25rem, 5.2vw, 1.5rem); line-height: 1.35; transition: opacity .6s ease; }
  #texto-dedicatoria.oculto { opacity: 0; }

  .controles { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 16px; }
  .ctrl { background: none; border: none; color: var(--texto); cursor: pointer; display: grid; place-items: center; }
  .ctrl svg { width: 28px; height: 28px; fill: currentColor; }
  .ctrl.play { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, var(--morado), var(--rosa)); box-shadow: 0 8px 26px rgba(255, 111, 181, .45); }
  .ctrl.play svg { width: 30px; height: 30px; }
  .ctrl:active { transform: scale(.92); }

  /* ---------- Lista ---------- */
  .lista { margin-top: 24px; }
  .lista h3 { font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--suave); margin-bottom: 8px; }
  .pista {
    display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 10px; cursor: pointer;
    transition: background .2s;
  }
  .pista:hover, .pista.activa { background: rgba(255, 255, 255, .07); }
  .pista .num { width: 20px; text-align: center; font-size: .85rem; color: var(--suave); }
  .pista .datos { flex: 1; min-width: 0; }
  .pista .cancion { font-size: .95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pista .artista { font-size: .78rem; color: var(--suave); }
  .pista.activa .cancion { color: var(--lila); }
  .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; width: 20px; justify-content: center; }
  .eq i { width: 3px; background: var(--lila); border-radius: 2px; animation: barra .8s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: .25s; } .eq i:nth-child(3) { animation-delay: .5s; }
  @keyframes barra { from { height: 3px; } to { height: 14px; } }
  .pista.activa .num { display: none; }
  .pista.activa .eq { display: flex; }
  .pausado .pista.activa .eq i { animation-play-state: paused; }

  .boton {
    display: block; margin: 26px auto 0; padding: 13px 26px; border: none; border-radius: 999px; cursor: pointer;
    font-family: 'Poppins', sans-serif; font-size: .95rem; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--morado), var(--rosa)); box-shadow: 0 8px 26px rgba(255, 111, 181, .4);
  }
  .boton:active { transform: scale(.96); }
  .boton.secundario { background: rgba(255, 255, 255, .08); box-shadow: none; border: 1px solid var(--borde); }

  /* ---------- Capas ---------- */
  .capa {
    position: fixed; inset: 0; z-index: 20; padding: 24px 16px; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: rgba(12, 6, 24, .9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  .capa.visible { opacity: 1; pointer-events: auto; }
  .capa .icono { font-size: 3.6rem; animation: flotar 2.4s ease-in-out infinite; }
  @keyframes flotar { 50% { transform: translateY(-8px); } }
  .capa h2 { font-family: 'Dancing Script', cursive; font-size: clamp(2.1rem, 9vw, 3rem); margin: 10px 0 6px; color: #f3dcff; }
  .capa p { color: var(--suave); }
  .final-caja { max-width: 440px; }
  .final-caja .texto { margin-top: 14px; color: var(--texto); font-weight: 300; font-size: 1.05rem; line-height: 1.75; }
  .final-caja .firma { margin-top: 18px; font-family: 'Dancing Script', cursive; font-size: 1.7rem; color: #ffb3e0; }

  .particula { position: fixed; z-index: 30; pointer-events: none; }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="cabecera">
    <div class="portada"><span class="grande">Ma</span><span class="chico">CUMPLE MIX</span></div>
    <div class="info">
      <div class="tipo">Playlist</div>
      <h1>Playlist de cumpleaños 💜</h1>
      <p>Hecha con amor para <b id="nombre-info"></b> · 7 canciones, 7 deseos</p>
    </div>
  </header>

  <section class="reproductor">
    <div class="video"><div id="yt"></div></div>
    <div class="ahora">
      <div>
        <span class="chip" id="chip-integrante"></span>
        <h2 id="titulo-cancion"></h2>
      </div>
      <button class="corazon" id="corazon" aria-label="Me encanta">💜</button>
    </div>
    <div class="dedicatoria">
      <small>Un deseo de tu hijo</small>
      <p id="texto-dedicatoria"></p>
    </div>
    <div class="controles">
      <button class="ctrl" id="anterior" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ctrl play" id="play" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" id="icono-play"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctrl" id="siguiente" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </section>

  <section class="lista">
    <h3>Canciones</h3>
    <div id="pistas"></div>
  </section>

  <button class="boton secundario" id="btn-final">💌 Ver mi mensaje final</button>
</div>

<!-- Inicio -->
<div class="capa visible" id="capa-inicio">
  <div class="icono">🎧</div>
  <h2 id="titulo-inicio"></h2>
  <p>7 canciones de BTS, cada una con un deseo para ti</p>
  <button class="boton" id="btn-empezar">▶ Darle play</button>
</div>

<!-- Final -->
<div class="capa" id="capa-final">
  <div class="final-caja">
    <div class="icono">💜</div>
    <h2 id="titulo-final"></h2>
    <p class="texto" id="texto-final"></p>
    <p class="firma" id="firma-final"></p>
    <button class="boton" id="btn-cerrar">Seguir escuchando 🎶</button>
  </div>
</div>

<script>
/* =========================================================
   ✏️  PERSONALIZA AQUÍ  ✏️
   ========================================================= */
const CONFIG = {
  nombre: "Lorena",
  apodo: "Ma",
  canciones: [
    { integrante: "RM", cancion: "Wild Flower (with youjeen)", id: "u18be_kRmC0",
      deseo: "Como una flor que crece en cualquier rincón, tú siempre encontraste la forma de florecer, incluso en los días difíciles. Y mientras florecías, me enseñaste a mí a hacerlo." },
    { integrante: "Jin", cancion: "The Astronaut", id: "c6ASQOwKkhk",
      deseo: "No importa qué tan lejos vaya ni cuánto crezca: tú siempre vas a ser mi lugar en el universo, el planeta al que siempre quiero volver." },
    { integrante: "SUGA", cancion: "People Pt.2 (feat. IU)", id: "uVD-YgzDzyY",
      deseo: "Gracias por quererme tal como soy, con mis aciertos y mis errores. Contigo nunca he tenido que fingir ser alguien más." },
    { integrante: "j-hope", cancion: "on the street (with J. Cole)", id: "r6WbbU_lLCA",
      deseo: "Por cada calle que he caminado y cada paso que he dado, sé que tu amor y tus bendiciones han ido conmigo." },
    { integrante: "Jimin", cancion: "Who", id: "Av9DvtlJ9_M",
      deseo: "Si alguien me pregunta quién es la mujer más importante de mi vida, la respuesta siempre, siempre vas a ser tú." },
    { integrante: "V", cancion: "Love Me Again", id: "HYzyRHAHJl8",
      deseo: "Si tuviera que volver a nacer, le pediría a Dios la misma mamá. Te volvería a elegir a ti, una y mil veces." },
    { integrante: "Jung Kook", cancion: "Standing Next to You", id: "UNo0TG9LwwI",
      deseo: "Así como tú siempre has estado a mi lado, quiero que sepas que yo voy a estar al tuyo, hoy y todos los días de tu vida." }
  ],
  final: {
    titulo: "Feliz cumpleaños, Ma",
    texto: "Ninguna canción alcanza para decirte cuánto te quiero, pero ojalá esta playlist te acompañe cada vez que quieras sonreír. Gracias por ser mi hogar, mi ejemplo y la mejor mamá del mundo. Que Dios te bendiga hoy y siempre.",
    firma: "Te morado, Ma 💜 — Tu hijo"
  }
};
/* ========================================================= */

const $ = (id) => document.getElementById(id);
const azar = (a, b) => a + Math.random() * (b - a);

$('nombre-info').textContent = CONFIG.nombre;
$('titulo-inicio').textContent = `Te hice una playlist, ${CONFIG.apodo} 💜`;
$('titulo-final').textContent = CONFIG.final.titulo;
$('texto-final').textContent = CONFIG.final.texto;
$('firma-final').textContent = CONFIG.final.firma;

/* ---------- Lista de canciones ---------- */
const lista = $('pistas');
CONFIG.canciones.forEach((c, i) => {
  const fila = document.createElement('div');
  fila.className = 'pista';
  fila.innerHTML = `<span class="num">${i + 1}</span><span class="eq"><i></i><i></i><i></i></span>
    <div class="datos"><div class="cancion"></div><div class="artista"></div></div>`;
  fila.querySelector('.cancion').textContent = c.cancion;
  fila.querySelector('.artista').textContent = c.integrante + ' · BTS';
  fila.addEventListener('click', () => cargar(i, true));
  lista.appendChild(fila);
});

/* ---------- Reproductor de YouTube ---------- */
let reproductor = null, listo = false, actual = 0, sonando = false, pendiente = null;

window.onYouTubeIframeAPIReady = () => {
  reproductor = new YT.Player('yt', {
    videoId: CONFIG.canciones[0].id,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        listo = true;
        if (pendiente !== null) { const p = pendiente; pendiente = null; cargar(p, true); }
      },
      onStateChange: (e) => {
        sonando = e.data === YT.PlayerState.PLAYING;
        document.body.classList.toggle('pausado', !sonando);
        $('icono-play').innerHTML = sonando
          ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
          : '<path d="M8 5v14l11-7z"/>';
        if (e.data === YT.PlayerState.ENDED) {
          if (actual < CONFIG.canciones.length - 1) cargar(actual + 1, true);
          else mostrarFinal();
        }
      }
    }
  });
};
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

function cargar(i, reproducir) {
  actual = i;
  const c = CONFIG.canciones[i];
  $('chip-integrante').textContent = c.integrante.toUpperCase();
  $('titulo-cancion').textContent = c.cancion;
  const d = $('texto-dedicatoria');
  d.classList.add('oculto');
  setTimeout(() => { d.textContent = c.deseo; d.classList.remove('oculto'); }, 350);
  document.querySelectorAll('.pista').forEach((f, j) => f.classList.toggle('activa', j === i));
  if (!listo) { pendiente = reproducir ? i : null; return; }
  if (reproducir) reproductor.loadVideoById(c.id);
  else reproductor.cueVideoById(c.id);
}

$('play').addEventListener('click', () => {
  if (!listo) { pendiente = actual; return; }
  if (sonando) reproductor.pauseVideo(); else reproductor.playVideo();
});
$('siguiente').addEventListener('click', () => cargar((actual + 1) % CONFIG.canciones.length, true));
$('anterior').addEventListener('click', () => cargar((actual - 1 + CONFIG.canciones.length) % CONFIG.canciones.length, true));

/* ---------- Inicio y final ---------- */
$('btn-empezar').addEventListener('click', () => {
  $('capa-inicio').classList.remove('visible');
  cargar(0, true);
  if (listo) reproductor.playVideo();
});
function mostrarFinal() {
  $('capa-final').classList.add('visible');
  for (let i = 0; i < 4; i++) setTimeout(() => estallido(azar(innerWidth * .2, innerWidth * .8), azar(innerHeight * .2, innerHeight * .6), 20), i * 350);
}
$('btn-final').addEventListener('click', mostrarFinal);
$('btn-cerrar').addEventListener('click', () => $('capa-final').classList.remove('visible'));

/* ---------- Corazones ---------- */
$('corazon').addEventListener('click', (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  estallido(r.left + r.width / 2, r.top + r.height / 2, 16);
});
function estallido(x, y, n) {
  const s = ['💜', '💖', '✨', '🎂', '💕'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'particula';
    p.textContent = s[Math.floor(Math.random() * s.length)];
    p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.fontSize = azar(14, 26) + 'px';
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = azar(60, 170);
    p.animate([
      { transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d - 50}px)) scale(1)`, opacity: 0 }
    ], { duration: azar(1000, 1600), easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }).onfinish = () => p.remove();
  }
}

/* Mostrar la primera canción mientras carga */
cargar(0, false);
</script>
</body>
</html>
